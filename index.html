<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cartitas</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=12">
  <link rel="icon" href="./apple-touch-icon.png?v=12">
  <meta name="theme-color" content="#ffd6e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root{
      /* 💗 Paleta romántica */
      --bg:#fff5fb;
      --card:#ffffffee;

      --pink:#ff8fc1;
      --pink2:#ff5aa6;
      --rose:#ffd1e6;
      --lilac:#f3d6ff;

      --text:#4a2f40;
      --muted:#7a5b6c;

      --ring: rgba(255,90,166,.35);

      --radius:18px;
      --shadow:0 12px 34px rgba(255,90,166,.12);

      --space: clamp(12px, 2.8vw, 18px);
      --space-lg: clamp(16px, 4vw, 26px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-text-size-adjust: 100%;
      color:var(--text);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      overflow-x:hidden;

      /* 💕 Fondo romántico suave */
      background:
        radial-gradient(900px 520px at 12% -12%, rgba(255,143,193,.28), transparent 60%),
        radial-gradient(900px 520px at 110% 12%, rgba(243,214,255,.35), transparent 62%),
        radial-gradient(1100px 700px at 50% 120%, rgba(255,209,230,.35), transparent 60%),
        var(--bg);
    }

    /* Corazoncitos sutiles (sin imágenes) */
    body::before{
      content:"";
      position:fixed;
      inset:-40px;
      pointer-events:none;
      z-index:0;
      opacity:.35;
      filter: blur(.2px);
      background:
        radial-gradient(circle at 12% 18%, rgba(255,90,166,.25) 0 2px, transparent 3px),
        radial-gradient(circle at 30% 72%, rgba(255,143,193,.22) 0 1.8px, transparent 3px),
        radial-gradient(circle at 55% 35%, rgba(243,214,255,.22) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 58%, rgba(255,209,230,.22) 0 1.9px, transparent 3px),
        radial-gradient(circle at 92% 18%, rgba(255,90,166,.22) 0 2.1px, transparent 3px);
      animation: floaty 14s ease-in-out infinite;
    }

    @keyframes floaty{
      0%{ transform: translateY(-8px); }
      50%{ transform: translateY(10px); }
      100%{ transform: translateY(-8px); }
    }

    /* Capa base para que todo quede arriba del “before” */
    body > *{ position:relative; z-index:1; }

    .splash{
      position:fixed; inset:0; z-index:10; display:grid; place-items:center;
      min-height:100dvh;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.78));
      backdrop-filter: blur(10px);
      transition:opacity .45s ease, visibility .45s ease;
      padding: var(--space);
    }
    .splash.hide{opacity:0; visibility:hidden}

    .splash-card{
      width:min(92vw, 520px);
      padding: var(--space-lg);
      text-align:center;
      background:var(--card);
      border:1px solid rgba(255,90,166,.14);
      border-radius:22px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    /* Borde romántico arriba */
    .splash-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:10px;
      background: linear-gradient(90deg, var(--pink2), var(--rose), var(--lilac), var(--rose), var(--pink2));
      opacity:.95;
    }

    .splash h1{
      margin:10px 0 6px;
      color:var(--pink2);
      font-size: clamp(22px, 6.5vw, 28px);
      text-wrap: balance;
      letter-spacing:.2px;
    }
    .splash p{
      margin:0 0 var(--space);
      color:var(--muted);
      font-size:clamp(14px,3.8vw,16px)
    }

    /* Botón romántico */
    .btn{
      background: linear-gradient(180deg, var(--pink), var(--pink2));
      color:#fff;
      border:none;
      border-radius:999px;
      padding: 12px 20px;
      font-weight:800;
      box-shadow: 0 12px 28px rgba(255,90,166,.22);
      touch-action: manipulation;
      min-height: 44px;
      position:relative;
      overflow:hidden;
    }
    .btn::after{
      content:"";
      position:absolute;
      inset:-40% -20%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 35%);
      transform: rotate(12deg);
      opacity:.65;
    }
    .btn:active{ transform: translateY(1px); }

    header.topbar{
      position:sticky; top:0; z-index:5;
      background: rgba(255,255,255,.86);
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(255,90,166,.12);
      padding: calc(env(safe-area-inset-top) + 10px) var(--space) 10px;
    }

    /* Línea romántica suave arriba de la topbar */
    header.topbar::before{
      content:"";
      display:block;
      height:10px;
      border-radius:999px;
      background:
        radial-gradient(circle, rgba(255,90,166,.85) 0 3px, transparent 4px) 0 0/22px 10px,
        radial-gradient(circle, rgba(255,143,193,.75) 0 3px, transparent 4px) 11px 0/22px 10px,
        radial-gradient(circle, rgba(243,214,255,.75) 0 3px, transparent 4px) 0 0/22px 10px;
      opacity:.7;
      margin-bottom:8px;
    }

    .brand{
      font-weight:900;
      color:var(--text);
      text-align:center;
      font-size: clamp(16px, 4.8vw, 18px);
      letter-spacing:.2px;
    }
    .brand small{
      display:inline-block;
      margin-left:8px;
      font-weight:900;
      color:var(--pink2);
      background: rgba(255,209,230,.55);
      border: 1px solid rgba(255,90,166,.18);
      padding: 2px 10px;
      border-radius:999px;
      font-size: .78em;
      transform: translateY(-1px);
    }

    .container{
      width:100%;
      max-width: 820px;
      margin: var(--space) auto calc(var(--space-lg) * 2);
      padding-inline: max(var(--space), env(safe-area-inset-left));
    }

    .card{
      background:var(--card);
      border:1px solid rgba(255,90,166,.12);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding: var(--space);
      position:relative;
      overflow:hidden;
    }

    /* Detalle sutil en el borde de la card */
    .card::before{
      content:"";
      position:absolute;
      inset:auto 0 0 0;
      height:6px;
      background: linear-gradient(90deg, var(--lilac), var(--rose), var(--pink2));
      opacity:.75;
    }

    h2{
      margin: 4px 0 var(--space);
      color: var(--pink2);
      font-size: clamp(18px, 5.6vw, 22px);
      text-wrap: balance;
    }

    .listado{display:grid; gap: clamp(10px,3.2vw,14px)}

    .item{
      padding: clamp(12px,3.6vw,16px);
      border:1px solid rgba(255,90,166,.12);
      border-radius:14px;
      background:#fff;
      box-shadow: 0 10px 18px rgba(0,0,0,.04);
    }

    .item h3{
      margin:0 0 6px;
      color: var(--pink2);
      font-weight:800;
      font-size: clamp(16px, 4.8vw, 18px);
      line-height:1.2;
      text-wrap: balance;
    }

    .meta{
      color:var(--muted);
      font-size: clamp(12px,3.8vw,14px)
    }

    .contenido{
      margin-top: 8px;
      line-height: 1.75;
      font-size: clamp(15px, 4.6vw, 17px);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Banner romántico */
    .banner{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      margin-bottom: var(--space);
      background: linear-gradient(90deg, rgba(255,143,193,.12), rgba(243,214,255,.14), rgba(255,209,230,.14));
      border: 1px solid rgba(255,90,166,.12);
      color: var(--text);
      font-weight: 750;
      text-align:center;
    }
    .banner span{
      color: var(--pink2);
      font-weight: 900;
    }

    .footer{
      padding: calc(var(--space-lg) + env(safe-area-inset-bottom)) var(--space);
      text-align:center;
      color:var(--muted);
      font-size: clamp(12px,3.6vw,14px);
    }


    .hero{
      margin-bottom:20px;
    }
    .hero img{
      width:100%;
      display:block;
      border-radius:18px;
      border:2px solid rgba(255,90,166,.15);
      box-shadow:0 12px 30px rgba(255,90,166,.15);
    }
    .contador-amor{
      margin:16px 0 20px;
      padding:14px;
      text-align:center;
      border-radius:14px;
      background:linear-gradient(90deg,rgba(255,143,193,.12),rgba(243,214,255,.14));
      border:1px solid rgba(255,90,166,.12);
      font-weight:700;
      color:var(--pink2);
    }
    .mimo-btn{width:100%;margin-bottom:15px;}
    .mimo-mensaje{
      display:none;
      background:white;
      padding:15px;
      border-radius:14px;
      border:1px solid rgba(255,90,166,.12);
      text-align:center;
      color:var(--text);
      margin-bottom:20px;
    }

    :focus-visible{
      outline: 3px solid var(--ring);
      outline-offset: 2px;
      border-radius:10px
    }
    a,button{ -webkit-tap-highlight-color: transparent }

    @media (max-width: 380px){
      .splash-card{padding: 14px}
      .item{padding: 12px}
    }
    @media (prefers-reduced-motion: reduce){
      body::before{animation:none}
      .splash{transition:none}
    }
  </style>
</head>

<body>
  <div class="splash" id="splash">
    <div class="splash-card">
      <h1>Para vos ❤️</h1>
      <p>(tocame para abrir 💌)</p>
      <button id="openBtn" class="btn">Abrir</button>
    </div>
  </div>

  <header class="topbar">
    <div class="brand">Mensajitos de amor <small>💗 2026</small></div>
  </header>

  <main class="container">
    <section class="card">
      

      <div class="hero">
        <img id="fotoPortada" src="foto (1).jpeg" alt="Nosotros">
      </div>

      <div class="contador-amor">❤️ Cargando...</div>

      <button id="mimoBtn" class="btn mimo-btn">Necesito un mimo ❤️</button>
      <div id="mimoMensaje" class="mimo-mensaje"></div>



      <h2>Tus Mensajes</h2>
      <div id="listado" class="listado"></div>
      <p class="meta" id="estado">Cargando…</p>
    </section>
  </main>

  <footer class="footer">Hecho con 💖 por Tu novio Hermoso</footer>

  <script>
    const FEED_URL = "https://gist.githubusercontent.com/Int-Code-UY/ee642cb9278f57311196c31e500e28df/raw/cartas.json";
    const splash = document.getElementById('splash');
    const openBtn = document.getElementById('openBtn');
    openBtn.addEventListener('click', ()=> splash.classList.add('hide'));
    splash.addEventListener('click', (e)=>{ if(e.target===splash) splash.classList.add('hide'); });

    const listado = document.getElementById('listado');
    const estado  = document.getElementById('estado');

    const TZ = 'America/Montevideo';
    function parseDateSafe(input) {
      if (!input) return null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(input)) {
        const [y, m, d] = input.split('-').map(Number);
        return new Date(y, m - 1, d);
      }
      const d2 = new Date(input);
      return Number.isNaN(d2.getTime()) ? null : d2;
    }
    function formatearFecha(f) {
      const d = parseDateSafe(f);
      if (!d) return '';
      return new Intl.DateTimeFormat('es-UY', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        timeZone: TZ
      }).format(d);
    }

    async function cargarCartas(){
      try{
        const url = `${FEED_URL}?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if(!res.ok) throw new Error('No pude leer el feed');
        const cartas = await res.json();

        listado.innerHTML = '';
        cartas.forEach(c => {
          const item = document.createElement('div');
          item.className = 'item';
          item.style.animationDelay = `${cartas.indexOf(c) * 0.15}s`;
          item.innerHTML = `
            <h3>${esc(c.titulo || 'Sin título')}</h3>
            <div class="meta">${esc(formatearFecha(c.fecha))}</div>
            <div class="contenido">${renderContenido(c.contenido)}</div>
          `;
          listado.appendChild(item);
        });
        estado.textContent = cartas.length ? '' : 'Aún no hay cartas';
      }catch(err){
        estado.textContent = 'Sin conexión o feed no disponible.';
        console.error(err);
      }
    }

    function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function renderContenido(s){ return esc(String(s ?? '')).replace(/\n/g,'<br>'); }


    function actualizarContadorAmor(){
      const inicio = new Date('2023-01-13');
      const hoy = new Date();
      const dias = Math.floor((hoy - inicio)/(1000*60*60*24));
      const el = document.querySelector('.contador-amor');
      if(el){
        el.innerHTML = `❤️ Juntos desde el 13/01/2023<br>${dias} días de amor 💕`;
      }
    }

    const mensajesMimos = [
      "Sos lo más lindo que me pasó ❤️",
      "Estoy orgulloso de vos 🌹",
      "Te elegiría mil veces más 💕",
      "Tu sonrisa mejora mis días ✨",
      "Gracias por estar conmigo 💖",
      "Sos mi lugar favorito 🏡❤️",
      "Ojalá pudiera abrazarte ahora mismo 🤗",
      "Siempre pienso en vos 🌷",
      "Sos mi persona favorita 💞",
      "Cada día a tu lado es un regalo 🎁",
      "Deseoso de pasar el resto de mi vida contigo 💍",
      "Amo cada berrinche tuyo, sos perfecta para mí 😘",
      "Amo tu cuerpo como tu alma 💗",
      "Sos lo que me motiva a avanzar cada día 🚀",
      "Quiero ser el mejor yo posible para vos 🌟",
      "Nada relaja mas mi corazon que saber que estas ahí 💓",
      "Quiero seguir conociéndote toda la vida💫",
      "Amo ser parte de cada momento de tu vida, gracias por dejarme estar 💖",
      "Nada acelera mas mi corazon que verte feliz 😊",
      "Sos mi pensamiento favorito 💭❤️",
      "Cada comida contigo es mi favorita 🍲💕",
      "Me da igual la comida, lo que importa es comerla con vos 🍽️❤️",
      "Me da igual el momento o el lugar, mientras haya un beso tuyo para acompañarlo 😘",
    ];

    document.addEventListener('DOMContentLoaded',()=>{
      actualizarContadorAmor();

      const btn=document.getElementById('mimoBtn');
      const div=document.getElementById('mimoMensaje');

      if(btn && div){
        btn.addEventListener('click',()=>{
          const mensaje=mensajesMimos[Math.floor(Math.random()*mensajesMimos.length)];
          div.innerHTML=mensaje;
          div.style.display='block';
        });
      }
    });



    document.addEventListener('DOMContentLoaded',()=>{

      const fotos = [
        'foto (1).jpeg',
        'foto (2).jpeg',
        'foto (3).jpeg',
        'foto (4).jpeg',
        'foto (5).jpeg',
        'foto (6).jpeg',
        'foto (7).jpeg'
      ];

      const foto = document.getElementById('fotoPortada');

      if(foto){
        function cambiarFoto(){
          const aleatoria = fotos[Math.floor(Math.random()*fotos.length)];
          foto.style.opacity = '0';

          setTimeout(()=>{
            foto.src = aleatoria + '?t=' + Date.now();
            foto.style.opacity = '1';
          },300);
        }

        foto.style.transition = 'opacity .6s ease';

        cambiarFoto();
        setInterval(cambiarFoto, 100000);
      }

    });


    cargarCartas();
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) cargarCartas(); });
    window.addEventListener('pageshow', (e)=>{ if(e.persisted) cargarCartas(); });

    if('serviceWorker' in navigator){
      const code = `
        const C='carta-shell-v2';
        self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./index.html'])));});
        self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.map(k=>k!==C&&caches.delete(k)))));});
        self.addEventListener('fetch',e=>{
          const u=new URL(e.request.url);
          if(u.origin===location.origin){ e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))); }
        });
      `;
      const blob = new Blob([code], {type:'text/javascript'});
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url);
    }
  </script>
</body>
</html>
